name: mdinterface-full
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy<2
  - biopython<1.86
  - docutils<0.18
  - pdb2pqr
  - netcdf4
  - ambertools=26
  - rdkit>=2024.3.5
  - openbabel=3.2
  - openff-interchange-base=0.5.5
  - openff-nagl=0.6.1
  - openff-nagl-models=2026.09.0
  - openff-toolkit-base=0.19.0
  - pytorch=*=cpu*
  - pip
  - pip:
      - -e .[test]
      - -r docs/requirements.txt
      - git+https://github.com/roncofaber/ligpargen.git@ad78036842318f166531be41cfcbc3563d7c5476
